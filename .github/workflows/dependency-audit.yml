name: Launch Dependency Audit

on:
  push:
    branches:
      - audit/launch-dependency-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Capture npm audit JSON
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))"
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-main-08ad9642
          path: npm-audit.json
          retention-days: 7
