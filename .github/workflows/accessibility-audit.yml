name: Launch Accessibility Audit

on:
  push:
    branches:
      - audit/launch-accessibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://ranking-rho-three.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install transient accessibility runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production accessibility audit
        run: npx playwright test tests/e2e/production-accessibility-audit.spec.mjs --config=playwright.production.config.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-accessibility-audit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
