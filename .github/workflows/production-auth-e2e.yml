name: Production Auth E2E

on:
  push:
    branches:
      - feat/launch-1-authenticated-e2e
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to test
        required: true
        default: https://ranking-rho-three.vercel.app
        type: string

permissions:
  contents: read

concurrency:
  group: production-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-smoke:
    name: Playwright authenticated production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://ranking-rho-three.vercel.app' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check E2E credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$E2E_USER_EMAIL" && -n "$E2E_USER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::E2E_USER_EMAIL and E2E_USER_PASSWORD repository secrets are required."
            exit 1
          fi
          echo "::notice::Authenticated production E2E skipped until repository secrets are configured."

      - name: Setup Node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci

      - name: Install pinned Playwright runner
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        if: steps.credentials.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production E2E
        if: steps.credentials.outputs.configured == 'true'
        run: npx playwright test tests/e2e/production-auth.spec.mjs --config=playwright.production-auth.config.mjs

      - name: Upload authenticated Playwright report
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-auth-e2e-report
          path: |
            playwright-auth-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
