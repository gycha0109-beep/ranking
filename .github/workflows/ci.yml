name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/p1-1-5-security-hotfix
      - 'ci/exact-head/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:p1-2
      - run: npm run verify:p1-3
      - run: npm run verify:p1-4
      - run: npm run verify:p1-5
      - run: npm run verify:p2-1
      - run: npm run verify:p2-2
      - run: npm run verify:ui-1
      - run: npm run verify:launch-1
      - run: npm run lint
      - name: Build
        id: build
        shell: bash
        run: |
          if ! npm run build > build.log 2>&1; then
            tail -120 build.log
            exit 1
          fi
          tail -40 build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://rankingwiki.example
      - name: Upload build failure log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          retention-days: 1
