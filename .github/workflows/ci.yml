name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/p1-1-5-security-hotfix
      - 'ci/exact-head/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:audit-r1
      - run: npm run verify:audit-r2
      - run: npm run verify:audit-r3
      - run: npm run verify:audit-r4
      - run: npm run verify:p1-2
      - run: npm run verify:p1-3
      - run: npm run verify:p1-4
      - run: npm run verify:p1-5
      - run: npm run verify:p2-1
      - run: npm run verify:p2-2
      - run: npm run verify:p2-3
      - run: npm run verify:ia-1
      - run: npm run verify:ia-2
      - run: npm run verify:ia-2b
      - run: npm run verify:ia-2c
      - run: npm run verify:ia-2d
      - run: npm run verify:ia-2d-controlled
      - run: npm run verify:ia-2e
      - run: npm run verify:ia-2f
      - run: npm run verify:ia-2g
      - run: npm run verify:ia-2h
      - run: npm run verify:ia-2i
      - run: npm run verify:ia-2j
      - run: npm run verify:ia-2k
      - run: npm run verify:ia-2l
      - run: npm run verify:ia-2m
      - run: npm run verify:rf-1
      - run: npm run verify:rf-1b
      - run: npm run verify:rf-1c
      - run: npm run verify:rf-1d
      - run: npm run verify:rf-1e
      - run: npm run verify:rf-1f
      - run: npm run verify:rf-1g
      - run: npm run verify:rf-1h
      - run: npm run verify:rf-1i
      - run: npm run verify:rf-1j
      - run: npm run verify:rf-1k
      - run: npm run verify:rf-1l
      - run: npm run verify:rf-1m-corpus
      - run: npm run verify:rf-1m
      - run: npm run verify:ops-1
      - run: npm run verify:public-copy
      - run: npm run verify:content-1
      - run: npm run verify:content-3
      - run: npm run verify:content-5
      - run: npm run verify:content-corpus-200
      - run: npm run verify:content-corpus-200-wave-1
      - run: npm run verify:content-corpus-200-wave-2
      - run: npm run verify:content-corpus-200-wave-3
      - run: npm run verify:content-corpus-200-wave-4
      - run: npm run verify:content-corpus-200-blocked-recovery-r1
      - run: npm run verify:content-corpus-200-blocked-recovery-r2
      - run: npm run verify:content-corpus-200-blocked-recovery-r3
      - run: npm run verify:content-corpus-200-blocked-recovery-r4
      - run: npm run verify:content-corpus-200-blocked-recovery-r5
      - run: npm run verify:content-corpus-200-blocked-recovery-r6
      - run: npm run verify:content-corpus-200-blocked-recovery-r7
      - run: npm run verify:content-corpus-200-blocked-recovery-r8
      - run: npm run verify:content-corpus-200-blocked-recovery-closure
      - run: npm run verify:content-corpus-200-effective-state
      - run: npm run verify:content-corpus-200-publication-preflight
      - run: npm run verify:content-corpus-200-current-production-overlap-review
      - run: npm run verify:content-corpus-200-proposed-taxonomy-review
      - run: npm run verify:content-corpus-200-editorial-scoring-review
      - run: npm run verify:content-corpus-200-editorial-rubric-dimension-authorization
      - run: npm run verify:content-corpus-200-editorial-dimension-contract-registry
      - run: npm run verify:content-corpus-200-editorial-dimension-evidence-wave-1
      - run: npm run verify:content-corpus-200-editorial-explicit-rubric-definition-wave-1
      - run: npm run verify:content-corpus-200-editorial-non-rubric-dimension-evidence-completion-wave-1
      - run: npm run verify:content-corpus-200-editorial-non-rubric-blocker-recovery-wave-1
      - run: npm run verify:ui-1
      - run: npm run verify:ui-2c
      - run: npm run verify:ui-2d
      - run: npm run verify:launch-1
      - run: npm run verify:launch-2
      - run: npm run verify:acq-1
      - run: npm run verify:acq-2
      - run: npm run verify:acq-3
      - run: npm run verify:measure-1
      - run: npm run verify:measure-2
      - run: npm run lint
      - name: Build
        id: build
        shell: bash
        run: |
          if ! npm run build > build.log 2>&1; then
            tail -120 build.log
            exit 1
          fi
          tail -40 build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://rankingwiki.example
      - name: Upload build failure log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          retention-days: 1
