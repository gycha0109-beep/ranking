name: Finalize Dependency Security Update

on:
  push:
    branches:
      - fix/launch-dependency-security

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Apply verified Next security update
        run: npm install --save-exact next@16.3.1 eslint-config-next@16.3.1
      - name: Apply non-breaking transitive fixes
        run: npm audit fix
      - name: Require zero known npm advisories
        shell: bash
        run: |
          npm audit --json > npm-audit-final.json || true
          node - <<'NODE'
          const audit = require('./npm-audit-final.json')
          const vulnerabilities = audit.metadata?.vulnerabilities || {}
          console.log(JSON.stringify(vulnerabilities, null, 2))
          if ((vulnerabilities.total || 0) !== 0) {
            console.error('Expected zero known npm advisories before finalizing dependency update.')
            process.exit(1)
          }
          NODE
      - name: Validate updated app
        run: |
          npm run verify:p1-2
          npm run verify:p1-3
          npm run verify:p1-4
          npm run verify:p1-5
          npm run verify:p2-1
          npm run verify:p2-2
          npm run verify:ui-1
          npm run verify:launch-1
          npm run lint
          npm run build
      - name: Record security update evidence
        shell: bash
        run: |
          cat > docs/launch-dependency-security-update.md <<'DOC'
          # Launch Dependency Security Update

          ## Baseline

          - Repository: `gycha0109-beep/ranking`
          - Baseline main: `08ad96428a92170873c51f1b495077303ac88fcb`
          - Baseline direct Next.js: `16.2.6`
          - Database / Hosted data mutation: none

          ## Audit finding

          An exact-lockfile `npm audit --json` against the launch baseline reported 7 known advisories:

          - high: 6
          - low: 1
          - critical: 0

          Affected aggregate packages included the direct `next` dependency plus transitive `postcss`, `sharp`, `@babel/core`, `brace-expansion`, and `js-yaml` paths.

          A trial update to Next `16.2.11` removed the direct Next advisory range but did not clear the vulnerable transitive dependency graph, so it was rejected as incomplete.

          ## Final update

          The verified bounded update is:

          - `next`: `16.3.1`
          - `eslint-config-next`: `16.3.1`
          - non-breaking `npm audit fix` lockfile resolution for remaining transitive advisories

          The resulting lockfile resolves the previously affected transitive packages to safe audit results and `npm audit --json` reports zero known advisories at generation time.

          ## Verification contract

          Before the generated package files are committed, automation requires:

          1. `npm audit` total = 0,
          2. P1-2 through P2-2 static contracts pass,
          3. UI-1 contract passes,
          4. LAUNCH-1 contract passes,
          5. ESLint passes,
          6. Next production build passes.

          The final repository branch then receives only the dependency files and this evidence document; the temporary preparation workflow removes itself.

          ## Runtime follow-up

          After merge approval and deployment, rerun the public production smoke/compatibility suite and inspect Vercel runtime errors. This dependency update does not alter database schema or Hosted content.
          DOC
      - name: Commit generated dependency update and remove preparer
        shell: bash
        run: |
          rm -f npm-audit-final.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/launch-dependency-security-update.md
          git rm .github/workflows/prepare-dependency-security-update.yml
          git commit -m "fix: update launch dependencies to audited versions"
          git push origin HEAD:fix/launch-dependency-security
